<title>池松さんのタスクボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, a day planner — time rail on the left of each row, checkbox first */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --fg: #1b2420;
  --muted: #5d6b65;
  --line: #d9e0dc;
  --accent: #1f6f5c;
  --accent-soft: #e1efe9;
  --hi: #b4372f;
  --hi-soft: #f8e4e2;
  --mid: #8a5a00;
  --mid-soft: #f6ecd6;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --surface: #1a2220; --fg: #e4ebe7; --muted: #9aa9a2; --line: #2c3834;
    --accent: #5cc3a3; --accent-soft: #1d3a31; --hi: #f08a80; --hi-soft: #3b2220;
    --mid: #e6b45a; --mid-soft: #37301f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1a2220; --fg: #e4ebe7; --muted: #9aa9a2; --line: #2c3834;
  --accent: #5cc3a3; --accent-soft: #1d3a31; --hi: #f08a80; --hi-soft: #3b2220;
  --mid: #e6b45a; --mid-soft: #37301f; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
header { display: grid; gap: 10px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .08em; }
h1 { margin: 0; font-size: 26px; line-height: 1.3; text-wrap: balance; }
.progress { display: flex; align-items: center; gap: 12px; }
.count { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); white-space: nowrap; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.free { margin: 0; color: var(--muted); font-size: 14px; }
.status { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--mid-soft); color: var(--fg); font-size: 14px; }
section { display: grid; gap: 10px; min-width: 0; }
h2 { margin: 0; font-size: 16px; display: flex; align-items: baseline; gap: 10px; }
h2 .sub { font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: .04em; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item {
  display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.item.urgent { border-left: 4px solid var(--hi); padding-left: 11px; }
.item.done { opacity: .55; }
.item.done .title { text-decoration: line-through; }
.check { position: relative; width: 24px; height: 24px; margin-top: 2px; cursor: pointer; }
.check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.box {
  display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px;
  border: 2px solid var(--muted); background: var(--surface); pointer-events: none;
}
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box::after { content: ""; width: 6px; height: 11px; border: solid var(--surface); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.check input:focus-visible + .box { outline: 3px solid var(--accent); outline-offset: 2px; }
.check input:disabled { cursor: progress; }
.body { min-width: 0; display: grid; gap: 4px; }
.line1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--accent); white-space: nowrap; }
.title { font-weight: 700; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.p-high { background: var(--hi-soft); color: var(--hi); border-color: transparent; font-weight: 700; }
.chip.p-mid { background: var(--mid-soft); color: var(--mid); border-color: transparent; }
.chip.due-hot { color: var(--hi); border-color: var(--hi); }
.min { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.min b { color: var(--fg); font-weight: 700; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.plain li { display: grid; grid-template-columns: 9.5em 1fr; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.plain .when { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.plain .what { min-width: 0; overflow-wrap: anywhere; }
.plain .what small { display: block; color: var(--muted); font-size: 12.5px; }
.notes { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.empty { margin: 0; color: var(--muted); font-size: 14px; }
.foot { margin: 0; color: var(--muted); font-size: 12.5px; }
@media (max-width: 480px) {
  h1 { font-size: 22px; }
  .plain li { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<main class="wrap">
  <header>
    <p class="eyebrow" id="date">今日の日付を読み込み中</p>
    <h1>今日のやること</h1>
    <div class="progress">
      <span class="count" id="count">0 / 0 完了</span>
      <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    </div>
    <p class="free" id="free"></p>
  </header>

  <p class="status" id="status">タスクを読み込んでいます。表示されないときは、Claude に「タスクボードを作って」と頼んでください。</p>

  <section id="sec-today" hidden>
    <h2>今日 <span class="sub">時間順</span></h2>
    <ol class="list" id="list-today"></ol>
  </section>

  <section id="sec-gap" hidden>
    <h2>すきま時間で片付けるもの</h2>
    <ul class="list" id="list-gap"></ul>
  </section>

  <section id="sec-open" hidden>
    <h2>まだ終わっていないもの <span class="sub">今日以外</span></h2>
    <ul class="list" id="list-open"></ul>
  </section>

  <section id="sec-upcoming" hidden>
    <h2>今後の予定</h2>
    <ul class="plain" id="list-upcoming"></ul>
  </section>

  <section id="sec-notes" hidden>
    <h2>気をつけるところ</h2>
    <ul class="notes" id="list-notes"></ul>
  </section>

  <p class="foot">チェックはその場で保存されます。Claude も同じ内容を読んで tasks.md に反映します。</p>
</main>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const status = $("status");
  let readOnly = false;
  let items = [];

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function prioClass(p) {
    return p === "高" ? "chip p-high" : p === "中" ? "chip p-mid" : "chip";
  }

  function itemRow(it, db) {
    const li = el("li", "item");
    if (it.urgent) li.classList.add("urgent");
    if (it.done) li.classList.add("done");

    const label = el("label", "check");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.id = "chk-" + it.id;
    input.checked = !!it.done;
    input.disabled = readOnly;
    input.setAttribute("aria-label", it.title + " を完了にする");
    label.append(input, el("span", "box"));

    input.addEventListener("change", async () => {
      const done = input.checked;
      input.disabled = true;
      li.classList.toggle("done", done);
      try {
        await db.doc("items/" + it.id).update({ done, doneAt: done ? new Date().toISOString() : null });
      } catch (e) {
        input.checked = !done;
        li.classList.toggle("done", !done);
        if (e && e.code === "invalid_argument") {
          readOnly = true;
          status.textContent = "このページではチェックを保存できません(閲覧のみの権限です)。";
        } else {
          status.textContent = "保存できませんでした。少し待ってからもう一度チェックしてください。";
        }
        status.hidden = false;
      } finally {
        input.disabled = readOnly;
      }
    });

    const body = el("div", "body");
    const line1 = el("div", "line1");
    if (it.time) line1.append(el("span", "time", it.time));
    line1.append(el("span", "title", it.title));
    body.append(line1);

    const meta = el("div", "meta");
    if (it.prio) meta.append(el("span", prioClass(it.prio), "優先 " + it.prio));
    if (it.due) {
      const due = el("span", "chip", "期限 " + it.due);
      if (it.urgent) due.classList.add("due-hot");
      meta.append(due);
    }
    if (it.mins) meta.append(el("span", "chip", "所要 " + it.mins));
    if (it.state) meta.append(el("span", "chip", it.state));
    if (meta.childNodes.length) body.append(meta);

    if (it.minimum) {
      const p = el("p", "min");
      p.append(el("b", null, "最低ここまで: "), document.createTextNode(it.minimum));
      body.append(p);
    }
    li.append(label, body);
    return li;
  }

  function render(db) {
    const groups = { today: [], gap: [], open: [], upcoming: [] };
    for (const it of items) (groups[it.section] || groups.open).push(it);

    const checkable = [...groups.today, ...groups.gap, ...groups.open];
    const done = checkable.filter((i) => i.done).length;
    $("count").textContent = done + " / " + checkable.length + " 完了";
    $("barfill").style.width = checkable.length ? (done / checkable.length) * 100 + "%" : "0";

    for (const key of ["today", "gap", "open"]) {
      const list = $("list-" + key);
      list.replaceChildren(...groups[key].map((it) => itemRow(it, db)));
      $("sec-" + key).hidden = groups[key].length === 0;
    }

    const up = $("list-upcoming");
    up.replaceChildren(...groups.upcoming.map((it) => {
      const li = el("li");
      li.append(el("span", "when", it.time || it.due || ""));
      const what = el("span", "what", it.title);
      if (it.minimum) what.append(el("small", null, it.minimum));
      li.append(what);
      return li;
    }));
    $("sec-upcoming").hidden = groups.upcoming.length === 0;
  }

  const claude = window.claude;
  const db = claude && claude.use ? await claude.use("db") : null;
  if (!db) {
    status.textContent = "このページを開いている環境ではタスクを読み込めません。claude.ai にサインインして開いてください。";
    return;
  }
  const user = await claude.use("user");
  if (user && typeof user.can === "function") {
    try { if ((await user.can("data.write")) === false) readOnly = true; } catch (_) {}
  }

  db.doc("meta/board").onSnapshot((snap) => {
    const m = snap.exists ? snap.data() : null;
    if (!m) return;
    if (m.date) $("date").textContent = m.date + (m.updated ? " ・ " + m.updated + " 時点" : "");
    $("free").textContent = m.free || "";
    const notes = Array.isArray(m.notes) ? m.notes : [];
    $("list-notes").replaceChildren(...notes.map((n) => el("li", null, String(n))));
    $("sec-notes").hidden = notes.length === 0;
  }, () => {});

  db.collection("items").orderBy("order").onSnapshot((snap) => {
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (items.length) {
      status.hidden = true;
    } else {
      status.hidden = false;
      status.textContent = "まだタスクがありません。Claude に「今日のタスクボードを作って」と頼むと、ここに並びます。";
    }
    render(db);
  }, (e) => {
    status.hidden = false;
    status.textContent = "タスクを読み込めませんでした。ページを開き直してください。";
  });
})();
</script>
